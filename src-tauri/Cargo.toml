[package]
name = "canopi-desktop"
version = "0.0.1"
edition = "2021"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
fs2 = "0.4"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros", "net"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Same versions the tauri/wry tree already uses on Windows; enables direct
# WebView2 control (script eval with result, CapturePreview screenshots,
# navigation/permission policy hooks) for the per-agent browser surfaces.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }
