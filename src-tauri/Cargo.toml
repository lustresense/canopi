[package]
name = "canopi-desktop"
version = "0.3.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
fs2 = "0.4"
portable-pty = "0.9"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
