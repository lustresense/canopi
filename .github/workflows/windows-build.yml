name: canoPi Windows source build and smoke
on:
  workflow_dispatch:
    inputs:
      releaseMode:
        description: 'Build mode: Development (unsigned) or Signed (requires certificate secrets)'
        required: true
        default: 'Development'
        type: choice
        options:
          - Development
          - Signed
  push:
    branches: [dev, master]

permissions:
  contents: read

env:
  # Expected certificate values from secrets (independent of runtime import)
  CANOPI_CERT_THUMBPRINT: ${{ secrets.CANOPI_CERT_THUMBPRINT }}
  CANOPI_CERT_SUBJECT: ${{ secrets.CANOPI_CERT_SUBJECT }}
  CANOPI_CERT_DIGEST_ALGORITHM: ${{ secrets.CANOPI_CERT_DIGEST_ALGORITHM }}
  CANOPI_CERT_TIMESTAMP_URL: ${{ secrets.CANOPI_CERT_TIMESTAMP_URL }}

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RELEASE_MODE: ${{ github.event.inputs.releaseMode || 'Development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Windows code-signing certificate (Signed mode only)
        if: env.RELEASE_MODE == 'Signed'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.CANOPI_CERT_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.CANOPI_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_CERTIFICATE -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Signed mode requires CANOPI_CERT_PFX and CANOPI_CERT_PASSWORD secrets (production signing certificate is an external prerequisite)'
          }
          $certDir = Join-Path $env:TEMP ('canopi-cert-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $certDir -Force | Out-Null
          try {
            Set-Content -Path (Join-Path $certDir 'tempCert.txt') -Value $env:WINDOWS_CERTIFICATE
            certutil -decode (Join-Path $certDir 'tempCert.txt') (Join-Path $certDir 'certificate.pfx')
            if ($LASTEXITCODE -ne 0) { throw "certutil -decode failed with exit code $LASTEXITCODE" }
            Import-PfxCertificate -FilePath (Join-Path $certDir 'certificate.pfx') -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Out-Null
            Write-Host "Code signing certificate imported successfully"
          } finally {
            Remove-Item -LiteralPath $certDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify release-coherent worktree (tracked sources complete)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $porcelain = @(git status --porcelain)
          $bad = @($porcelain | Where-Object { $_ -match '^\?\?|^ D' })
          if ($bad.Count -gt 0) { throw "Worktree not release-coherent (untracked or deleted-but-unstaged tracked files): $($bad -join '; ')" }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          bun --version
          cargo --version
          python --version
      - name: Install 7-Zip (Signed mode only)
        if: env.RELEASE_MODE == 'Signed'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          7z --version
      - name: Clone pinned Oh My Pi source (not the prebuilt release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/can1357/oh-my-pi.git _upstream/oh-my-pi
          git -C _upstream/oh-my-pi checkout --detach 2a2c6dcbbb558c0f8145f67f28b3370984f2bf60
          $commit = (git -C _upstream/oh-my-pi rev-parse HEAD).Trim()
          if ($commit -ne '2a2c6dcbbb558c0f8145f67f28b3370984f2bf60') { throw 'Upstream SHA mismatch' }
          New-Item -ItemType Directory -Force src-tauri/resources/licenses | Out-Null
          Copy-Item _upstream/oh-my-pi/LICENSE src-tauri/resources/licenses/LICENSE-OMP.txt
          Copy-Item _upstream/oh-my-pi/THIRD-PARTY-NOTICES.txt src-tauri/resources/licenses/THIRD-PARTY-NOTICES-OMP.txt
      - name: Apply tracked cnp source fork overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/patch-omp.mjs _upstream/oh-my-pi
          git -C _upstream/oh-my-pi diff --check
          git -C _upstream/oh-my-pi diff -- packages/coding-agent/scripts/build-binary.ts
      - name: Install pinned OMP source dependencies (never links a global omp)
        working-directory: _upstream/oh-my-pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install
      - name: Compile native engine components
        working-directory: _upstream/oh-my-pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun run build:native
      - name: Compile cnp engine FROM fork source
        working-directory: _upstream/oh-my-pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun --cwd packages/coding-agent run build
      - name: Validate built engine, provenance, and RPC handshake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(Get-ChildItem '_upstream/oh-my-pi/packages/coding-agent/dist' -File | Where-Object { $_.Name -match '^cnp-engine(\.exe)?$' })
          if ($candidates.Count -ne 1) { throw "Expected exactly one source-built cnp-engine executable, found $($candidates.Count)" }
          $bin = $candidates[0].FullName
          $bytes = [IO.File]::ReadAllBytes($bin)
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Source build did not emit a valid-size Windows PE' }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw 'Source-built cnp engine --version failed' }
          python scripts/rpc-smoke.py $bin
          if ($LASTEXITCODE -ne 0) { throw 'Actual cnp RPC handshake failed' }
          Copy-Item $bin src-tauri/resources/engine/cnp-engine.exe
          python scripts/verify-engine-provenance.py _upstream/oh-my-pi src-tauri/resources/engine/cnp-engine.exe ENGINE-PROVENANCE.json
          python scripts/verify-engine-provenance.py --verify ENGINE-PROVENANCE.json _upstream/oh-my-pi src-tauri/resources/engine/cnp-engine.exe
          if ($LASTEXITCODE -ne 0) { throw 'Engine provenance revalidation failed' }
      - name: Install desktop dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
      - name: Unit and protocol tests
        run: npm test
      - name: Build React frontend from approved JSX
        run: npm run build
      - name: Cargo lockfile in sync (reproducible dependency set)
        working-directory: src-tauri
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo fetch --locked failed: Cargo.lock out of sync with Cargo.toml' }
      - name: Compile and test Rust IPC
        working-directory: src-tauri
        run: cargo test

      # ---------------- SIGNED MODE: Sign engine BEFORE packaging ----------------
      - name: Sign engine binary (Signed mode only)
        if: env.RELEASE_MODE == 'Signed'
        env:
          CANOPI_CERT_THUMBPRINT: ${{ secrets.CANOPI_CERT_THUMBPRINT }}
          CANOPI_CERT_SUBJECT: ${{ secrets.CANOPI_CERT_SUBJECT }}
          CANOPI_CERT_TIMESTAMP_URL: ${{ secrets.CANOPI_CERT_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CANOPI_CERT_THUMBPRINT -or -not $env:CANOPI_CERT_SUBJECT) { throw 'Signed mode requires CANOPI_CERT_THUMBPRINT and CANOPI_CERT_SUBJECT secrets' }
          $stagedEngine = 'src-tauri/resources/engine/cnp-engine.exe'
          if (-not (Test-Path -LiteralPath $stagedEngine -PathType Leaf)) { throw "Staged engine not found at $stagedEngine" }
          $signScript = (Resolve-Path "scripts/sign-engine.ps1").Path
          & $signScript -BinaryPath $stagedEngine -Thumbprint $env:CANOPI_CERT_THUMBPRINT -Subject $env:CANOPI_CERT_SUBJECT -TimestampUrl $env:CANOPI_CERT_TIMESTAMP_URL

      # ---------------- PACKAGE ----------------
      - name: Build NSIS Windows installer (Tauri)
        env:
          TAURI_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.CANOPI_CERT_THUMBPRINT }}
          TAURI_SIGNING_DIGEST_ALGORITHM: ${{ secrets.CANOPI_CERT_DIGEST_ALGORITHM }}
          TAURI_SIGNING_TIMESTAMP_URL: ${{ secrets.CANOPI_CERT_TIMESTAMP_URL }}
          TAURI_SIGNING_TSP: "true"
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseMode = "$env:RELEASE_MODE"
          if ($releaseMode -eq 'Signed') {
            if (-not "${{ secrets.CANOPI_CERT_THUMBPRINT }}") { throw 'ReleaseMode=Signed requires CANOPI_CERT_THUMBPRINT secret' }
            # Generate Tauri signing config override
            $signScript = (Resolve-Path "scripts/sign-engine.ps1").Path
            $configObj = [ordered]@{
              bundle = @{
                windows = @{
                  certificateThumbprint = "${{ secrets.CANOPI_CERT_THUMBPRINT }}"
                  digestAlgorithm = "${{ secrets.CANOPI_CERT_DIGEST_ALGORITHM }}"
                  timestampUrl = "${{ secrets.CANOPI_CERT_TIMESTAMP_URL }}"
                  tsp = $true
                  signCommand = @{
                    cmd = 'powershell.exe'
                    args = @(
                      '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $signScript,
                      '-BinaryPath', '%1',
                      '-Thumbprint', "${{ secrets.CANOPI_CERT_THUMBPRINT }}",
                      '-Subject', "${{ secrets.CANOPI_CERT_SUBJECT }}",
                      '-TimestampUrl', "${{ secrets.CANOPI_CERT_TIMESTAMP_URL }}"
                    )
                  }
                }
              }
            }
            $configPath = Join-Path $env:TEMP ('tauri-signing-config-' + [guid]::NewGuid().ToString('N') + '.json')
            $configObj | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $configPath -Encoding UTF8
            npm run package:windows -- --config $configPath
          } else {
            Write-Host "Building DEVELOPMENT installer (unsigned)"
            npm run package:windows
          }

      # ---------------- VERIFY ----------------
      - name: Verify Authenticode signatures on all shipped executables
        if: env.RELEASE_MODE == 'Signed'
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.CANOPI_CERT_THUMBPRINT }}
          EXPECTED_SUBJECT: ${{ secrets.CANOPI_CERT_SUBJECT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedThumbprint = "$env:EXPECTED_THUMBPRINT".ToUpper().Replace(' ', '')
          $expectedSubject = "$env:EXPECTED_SUBJECT"
          if (-not $expectedThumbprint) { throw 'EXPECTED_THUMBPRINT required for Signed mode' }
          if (-not $expectedSubject) { throw 'EXPECTED_SUBJECT required for Signed mode' }
          $bins = @(
            'src-tauri/target/release/canoPi.exe',
            'src-tauri/target/release/engine/cnp-engine.exe',
            'src-tauri/target/release/bundle/nsis/*.exe'
          )
          $allValid = $true
          foreach ($pattern in $bins) {
            $files = @(Get-ChildItem $pattern -File -ErrorAction SilentlyContinue)
            if ($files.Count -eq 0) {
              Write-Error "SIGNATURE FAIL: no files matched $pattern - cannot claim all shipped executables are signed"
              $allValid = $false
              continue
            }
            foreach ($file in $files) {
              $sig = Get-AuthenticodeSignature -FilePath $file.FullName
              $valid = $sig.Status -eq 'Valid'
              $thumbprint = "$($sig.SignerCertificate.Thumbprint)".ToUpper()
              $match = $thumbprint -eq $expectedThumbprint
              $subject = "$($sig.SignerCertificate.Subject)"
              $subjectMatch = $subject -eq $expectedSubject
              $tsCert = $sig.TimeStamperCertificate
              if (-not $valid -or -not $match -or -not $subjectMatch -or -not $tsCert) {
                Write-Error "SIGNATURE FAIL: $($file.FullName) Status=$($sig.Status) Thumbprint=$thumbprint Expected=$expectedThumbprint Subject=$subject ExpectedSubject=$expectedSubject TimeStamper=$([bool]$tsCert)"
                $allValid = $false
              } else {
                Write-Host "OK: $($file.FullName) Valid issuer=$subject Thumbprint=$thumbprint TimeStamper=$($tsCert.Subject)"
              }
            }
          }
          if (-not $allValid) { throw 'One or more shipped executables failed Authenticode verification' }
          Write-Host "All executables have valid Authenticode signatures with expected thumbprint, subject, and RFC3161 timestamp"

      - name: Verify embedded uninstaller signature (Signed mode only)
        if: env.RELEASE_MODE == 'Signed'
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.CANOPI_CERT_THUMBPRINT }}
          EXPECTED_SUBJECT: ${{ secrets.CANOPI_CERT_SUBJECT }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)[0]
          $extractDir = Join-Path $env:TEMP ('cnp-extract-' + [guid]::NewGuid().ToString('N'))
          try {
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            & 7z x $installer.FullName -o$extractDir -y | Out-Null
            $uninstaller = Get-ChildItem -LiteralPath $extractDir -Filter 'uninstall*.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              $uninstSig = Get-AuthenticodeSignature -FilePath $uninstaller.FullName
              $expectedThumbprint = "$env:EXPECTED_THUMBPRINT".ToUpper().Replace(' ', '')
              $expectedSubject = "$env:EXPECTED_SUBJECT"
              $uninstValid = $uninstSig.Status -eq 'Valid'
              $uninstThumbprint = $uninstSig.SignerCertificate.Thumbprint.ToUpper()
              $uninstMatch = $uninstThumbprint -eq $expectedThumbprint
              $uninstSubject = $uninstSig.SignerCertificate.Subject
              $uninstSubjectMatch = $uninstSubject -eq $expectedSubject
              $uninstTsCert = $uninstSig.TimeStamperCertificate
              if (-not $uninstValid -or -not $uninstMatch -or -not $uninstSubjectMatch -or -not $uninstTsCert) {
                throw "EMBEDDED UNINSTALLER SIGNATURE FAIL: $($uninstaller.FullName) Status=$($uninstSig.Status) Thumbprint=$uninstThumbprint Expected=$expectedThumbprint Subject=$uninstSubject ExpectedSubject=$expectedSubject TimeStamper=$([bool]$uninstTsCert)"
              }
              Write-Host "OK: Embedded uninstaller $($uninstaller.Name) Valid issuer=$uninstSubject Thumbprint=$uninstThumbprint TimeStamper=$($uninstTsCert.Subject)"
            } else {
              throw "Embedded uninstaller not found in installer"
            }
          } finally {
            if (Test-Path -LiteralPath $extractDir) { Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue }
          }

      - name: PE verify installer and preserve checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bins = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)
          if ($bins.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installer = $bins[0]
          $bytes = [IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Installer is not a real Windows PE' }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash + '  ' + $installer.Name | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Test safety of data cleanup against disposable mock roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-uninstall-data.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Data cleanup safety tests failed' }
      - name: Install and uninstall smoke (silent defaults Keep)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)[0]
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'NSIS silent installation failed' }
          $instDir = ''
          $uninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\canoPi'
          if (Test-Path $uninstKey) { $instDir = "$((Get-ItemProperty $uninstKey).InstallLocation)".Trim('"') }
          if (-not $instDir) { $instDir = Join-Path $env:LOCALAPPDATA 'canoPi' }
          $app = Join-Path $instDir 'canoPi.exe'
          if (-not (Test-Path -LiteralPath $app -PathType Leaf)) { throw "Installed canoPi.exe not found at $app" }
          $engine = Join-Path $instDir 'engine\cnp-engine.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw "Installed engine is absent: $engine" }
          # Avoid falsely claiming interactive user-session E2E on a headless CI runner.
          $uninstaller = Join-Path $instDir 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Uninstaller not found in install directory' }
          $uninstallKeys = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like '*canoPi*' })
          if ($uninstallKeys.Count -lt 1) { throw 'canoPi is missing from Windows registered applications (HKCU uninstall registry)' }
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $links = @(Get-ChildItem $start -Filter '*.lnk' -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*canoPi*' })
          if ($links.Count -lt 1) { throw 'canoPi Start Menu shortcut was not registered' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'NSIS silent uninstall failed' }
          if (Test-Path -LiteralPath $app) { throw 'Uninstall left the GUI executable' }
          'PASS: install, installed sidecar, uninstall (keep data by default). Interactive UI and real provider turn NOT tested.'
      - name: Create installer ZIP alongside standalone EXE
        if: success()
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)[0]
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer.FullName release/
          Copy-Item SHA256SUMS.txt release/
          Copy-Item ENGINE-PROVENANCE.json release/
          Compress-Archive -Path release/* -DestinationPath release/canoPi-windows-installer.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canopi-windows-build-evidence
          path: |
            ENGINE-PROVENANCE.json
            SHA256SUMS.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: canopi-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: canopi-windows-installer-zip
          path: release/canoPi-windows-installer.zip
          if-no-files-found: error
