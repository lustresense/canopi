name: canoPi Windows source build and smoke
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          bun --version
          cargo --version
          python --version
      - name: Clone pinned Oh My Pi source (not the prebuilt release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone https://github.com/can1357/oh-my-pi.git _upstream/oh-my-pi
          git -C _upstream/oh-my-pi checkout --detach 2a2c6dcbbb558c0f8145f67f28b3370984f2bf60
          $commit = (git -C _upstream/oh-my-pi rev-parse HEAD).Trim()
          if ($commit -ne '2a2c6dcbbb558c0f8145f67f28b3370984f2bf60') { throw 'Upstream SHA mismatch' }
          New-Item -ItemType Directory -Force src-tauri/resources/licenses | Out-Null
          Copy-Item _upstream/oh-my-pi/LICENSE src-tauri/resources/licenses/LICENSE-OMP.txt
          Copy-Item _upstream/oh-my-pi/THIRD-PARTY-NOTICES.txt src-tauri/resources/licenses/THIRD-PARTY-NOTICES-OMP.txt
      - name: Apply tracked cnp source fork overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/patch-omp.mjs _upstream/oh-my-pi
          git -C _upstream/oh-my-pi diff --check
          git -C _upstream/oh-my-pi diff -- packages/coding-agent/scripts/build-binary.ts
      - name: Setup pinned OMP source dependencies and Rust native addon
        working-directory: _upstream/oh-my-pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun setup
      - name: Compile cnp engine FROM fork source
        working-directory: _upstream/oh-my-pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun --cwd packages/coding-agent run build
      - name: Validate built engine, provenance, and RPC handshake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(Get-ChildItem '_upstream/oh-my-pi/packages/coding-agent/dist' -File | Where-Object { $_.Name -match '^cnp-engine(\.exe)?$' })
          if ($candidates.Count -ne 1) { throw "Expected exactly one source-built cnp-engine executable, found $($candidates.Count)" }
          $bin = $candidates[0].FullName
          $bytes = [IO.File]::ReadAllBytes($bin)
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Source build did not emit a valid-size Windows PE' }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw 'Source-built cnp engine --version failed' }
          python scripts/rpc-smoke.py $bin
          if ($LASTEXITCODE -ne 0) { throw 'Actual cnp RPC handshake failed' }
          Copy-Item $bin src-tauri/resources/engine/cnp-engine.exe
          python scripts/verify-engine-provenance.py _upstream/oh-my-pi src-tauri/resources/engine/cnp-engine.exe ENGINE-PROVENANCE.json
      - name: Install desktop dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund
      - name: Unit and protocol tests
        run: npm test
      - name: Build React frontend from approved JSX
        run: npm run build
      - name: Compile and test Rust IPC
        working-directory: src-tauri
        run: cargo test
      - name: Build NSIS Windows installer
        run: npm run package:windows
      - name: PE verify installer and preserve checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bins = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)
          if ($bins.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $installer = $bins[0]
          $bytes = [IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 1048576 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'Installer is not a real Windows PE' }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash + '  ' + $installer.Name | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Test safety of data cleanup against disposable mock roots
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-uninstall-data.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Data cleanup safety tests failed' }
      - name: Install and uninstall smoke (silent defaults Keep)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)[0]
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'NSIS silent installation failed' }
          $candidates = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter 'canoPi.exe' -Recurse -File -ErrorAction SilentlyContinue)
          if ($candidates.Count -lt 1) { throw 'Installed canoPi.exe not discovered in per-user Programs' }
          $app = $candidates[0]
          $engine = Join-Path $app.Directory.FullName 'engine/cnp-engine.exe'
          if (-not (Test-Path -LiteralPath $engine -PathType Leaf)) { throw "Installed engine is absent: $engine" }
          # Avoid falsely claiming interactive user-session E2E on a headless CI runner.
          $uninstaller = Join-Path $app.Directory.FullName 'uninstall.exe'
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) { throw 'Uninstaller not found in install directory' }
          $uninstallKeys = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Get-ItemProperty -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like '*canoPi*' })
          if ($uninstallKeys.Count -lt 1) { throw 'canoPi is missing from Windows registered applications (HKCU uninstall registry)' }
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'
          $links = @(Get-ChildItem $start -Filter '*.lnk' -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -like '*canoPi*' })
          if ($links.Count -lt 1) { throw 'canoPi Start Menu shortcut was not registered' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'NSIS silent uninstall failed' }
          if (Test-Path -LiteralPath $app.FullName) { throw 'Uninstall left the GUI executable' }
          'PASS: install, installed sidecar, uninstall (keep data by default). Interactive UI and real provider turn NOT tested.'
      - name: Create installer ZIP alongside standalone EXE
        if: success()
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter *.exe -File)[0]
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer.FullName release/
          Copy-Item SHA256SUMS.txt release/
          Copy-Item ENGINE-PROVENANCE.json release/
          Compress-Archive -Path release/* -DestinationPath release/canoPi-windows-installer.zip -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canopi-windows-build-evidence
          path: |
            ENGINE-PROVENANCE.json
            SHA256SUMS.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: canopi-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: canopi-windows-installer-zip
          path: release/canoPi-windows-installer.zip
          if-no-files-found: error
